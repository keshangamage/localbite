name: localbite
description: "LocalBite - discover local restaurants, save favourites and write reviews."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  flutter:
    sdk: flutter
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
